name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        run: ./crossplane xpkg build --package-root=. --examples-root=examples --package-file=crossplane-compositions.xpkg --ignore=".github/workflows/publish.yaml,deploy/configuration.yaml"

      - name: Push package (sha)
        run: ./crossplane xpkg push ghcr.io/entr0pian/crossplane-compositions:${{ github.sha }} --package-files=crossplane-compositions.xpkg

      - name: Push package (main)
        run: ./crossplane xpkg push ghcr.io/entr0pian/crossplane-compositions:main --package-files=crossplane-compositions.xpkg
