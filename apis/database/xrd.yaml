apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.database.taskapp.io
spec:
  scope: Namespaced
  group: database.taskapp.io
  names:
    kind: Database
    plural: databases
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                componentRef:
                  type: object
                  description: >-
                    Reference to the owning platform Component
                    (platform.taskapp.io/v1alpha1 Component). Authoritative
                    correlation link per PLATFORM_API_ARCHITECTURE.md — the
                    platform.taskapp.io/component label is derived from this,
                    not a substitute for it. This exact {componentRef:
                    {name}} shape reuses the pattern established by
                    apis/githubrepository.
                  properties:
                    name:
                      type: string
                      description: Name of the Component this resource belongs to.
                  required:
                    - name
                dbName:
                  type: string
                  description: Name of the database/schema to create.
                size:
                  type: string
                  description: >-
                    Sizing tier. Resolves internally to an RDS instance
                    class and allocated storage — not caller-settable
                    directly, so the composition can change what each tier
                    means without a schema change. Region, VPC, and subnets
                    are fixed by the composition, not exposed here.
                  enum: [small, medium, large]
                  default: small
              required:
                - componentRef
                - dbName
            status:
              type: object
              properties:
                connectionSecretRef:
                  type: object
                  description: >-
                    Internal control-plane detail — points to the local
                    connection Secret this composition generates in the
                    Database's own (management-cluster) namespace, per the
                    Database Connection Secret Contract in
                    RUNTIME_DEPENDENCIES.md. Cross-cluster consumers (e.g.
                    the Release controller) must resolve bindings through
                    `exports` instead, per SERVICE_BINDINGS.md — that local
                    Secret cannot be consumed from a workload cluster.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                exports:
                  type: array
                  description: >-
                    Public cross-cluster consumption contract, per
                    SERVICE_BINDINGS.md. Each entry advertises where one
                    aspect of this Database has been published for
                    workload clusters to pick up — consumers resolve
                    bindings through this field only, never through
                    connectionSecretRef or the local Secret it names.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: >-
                          Logical export name. Always "connection" for
                          Database v1.
                      type:
                        type: string
                        description: >-
                          Export payload kind. Always "Secret" for this
                          implementation.
                      location:
                        type: object
                        description: Where the export was published.
                        properties:
                          provider:
                            type: string
                            description: >-
                              Remote store provider. Always
                              "AWSSecretsManager" for this implementation.
                          key:
                            type: string
                            description: >-
                              Exact remote AWS Secrets Manager path
                              holding the connection bundle, in the form
                              /bindings/<namespace>/databases/<name>.
                        required:
                          - provider
                          - key
                      ready:
                        type: boolean
                        description: >-
                          True only once this export has actually been
                          published successfully — never true merely
                          because the underlying infrastructure is ready.
                    required:
                      - name
                      - type
                      - location
                      - ready
