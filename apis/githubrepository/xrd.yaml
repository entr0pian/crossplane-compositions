apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: githubrepositories.repo.taskapp.io
spec:
  scope: Namespaced
  group: repo.taskapp.io
  names:
    kind: GitHubRepository
    plural: githubrepositories
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                componentRef:
                  type: object
                  description: >-
                    Reference to the owning platform Component
                    (platform.taskapp.io/v1alpha1 Component). Authoritative
                    correlation link per PLATFORM_API_ARCHITECTURE.md — the
                    platform.taskapp.io/component label is derived from this,
                    not a substitute for it. This exact {componentRef:
                    {name}} shape is the pattern every future related-resource
                    XRD (Database, Queue, ...) should reuse.
                  properties:
                    name:
                      type: string
                      description: Name of the Component this resource belongs to.
                  required:
                    - name
                repoName:
                  type: string
                  description: Name of the GitHub repository to create.
                visibility:
                  type: string
                  enum: [public, private, internal]
                  default: private
                description:
                  type: string
                autoInit:
                  type: boolean
                  default: true
              required:
                - componentRef
                - repoName
            status:
              type: object
              properties:
                repoURL:
                  type: string
                  description: HTML URL of the created repository, promoted from the managed resource.
